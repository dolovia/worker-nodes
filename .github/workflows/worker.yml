name: Worker

on:
  workflow_dispatch:
    inputs:
      worker_id:
        description: 'Worker identifier'
        required: true
        default: 'worker_001'

jobs:
  run_worker:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    
    permissions:
      actions: write
      contents: read
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker image
        run: docker build -t worker .
      
      - name: Run worker
        run: |
          docker run \
            -e WORKER_ID="${{ inputs.worker_id }}" \
            -e POLL_INTERVAL=5 \
            -e MAX_RUNTIME_MINUTES=340 \
            -e GITHUB_REPOSITORY="${{ github.repository }}" \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
            -e TELEGRAM_CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}" \
            worker
